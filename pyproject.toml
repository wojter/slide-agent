[project]
name = "slideagent"
version = "0.1.0"
description = "AI-powered presentation image generator — from Markdown to PPTX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4,<1",
    "openai>=1.82,<2",
    "python-pptx>=1.0,<2",
    "typer>=0.15,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "langsmith>=0.3,<1",
]

[project.scripts]
slideagent = "slideagent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slideagent"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TCH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["slideagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
